<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Vida – Simulador de vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ff;--card:#fff;--tx:#1a1c3a;--mu:#6c7096;--ac:#6c5ce7;--bd:#dfe2f7;--ok:#00b894;--bad:#e17055;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13142a;--card:#1d1f3d;--tx:#eceeff;--mu:#9a9ec8;--bd:#2c2f58}}
:root[data-theme="dark"]{--bg:#13142a;--card:#1d1f3d;--tx:#eceeff;--mu:#9a9ec8;--bd:#2c2f58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{background:linear-gradient(135deg,#6c5ce7,#fd79a8);color:#fff;padding:14px 16px;border-radius:0 0 22px 22px}
.top h1{margin:0;font-size:20px}.top small{opacity:.9}
.stats{padding:12px 16px 4px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.st{font-size:12px;color:var(--mu)}
.bar{height:9px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:9px;transition:width .4s}
#log{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:7px}
.e{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.4}
.e b{color:var(--ac)}
.e.g{border-color:var(--ok)}.e.b{border-color:var(--bad)}
.acts{max-height:30vh;overflow-y:auto;display:flex;gap:6px;padding:6px 16px;flex-wrap:wrap}
.acts button{flex:1 1 30%;padding:9px 4px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;font-weight:600}
.acts button:disabled{opacity:.4}
.eacts{display:flex;gap:6px;padding:6px 16px;flex-wrap:wrap}
.eacts button{flex:1 1 30%;max-width:calc((100% - 12px)/3);padding:9px 4px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;font-weight:600}
.age{margin:4px 16px 8px;padding:15px;border-radius:16px;border:0;background:linear-gradient(135deg,#6c5ce7,#fd79a8);color:#fff;font-size:17px;font-weight:800}
.ft{display:flex;justify-content:space-between;padding:0 16px 10px;font-size:12px;color:var(--mu)}
.ft button{background:none;border:0;color:var(--ac);font-weight:700;font-size:12px}
#ov{z-index:20;position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#ov .bx{background:var(--card);border-radius:20px;padding:18px;width:100%;max-width:520px}
#ov p{margin:0 0 12px;font-size:16px;line-height:1.4}
#ov button{display:block;width:100%;margin:6px 0;padding:13px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-size:15px;font-weight:700}
#ov button.c2{display:inline-block;width:auto;margin:3px;padding:8px 12px;background:var(--bd);color:var(--tx);font-size:14px}#ov button.c2.sel{background:var(--ac);color:#fff}#ov button.w2{display:inline-block;width:38px;height:38px;padding:0;border-radius:50%;margin:3px;border:3px solid transparent}#ov button.w2.sel{border-color:var(--ac)}
#ov button.s{background:var(--bd);color:var(--tx)}

.top{display:flex;gap:12px;align-items:center}
.scr{position:fixed;inset:0;z-index:5;background:linear-gradient(160deg,#4834d4,#fd79a8);color:#fff;overflow-y:auto;display:none;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.scr.on{display:block}
.in{max-width:520px;margin:0 auto}
#ti .in{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px}
#ti h1{font-size:54px;margin:0;letter-spacing:2px;text-shadow:0 4px 18px rgba(0,0,0,.3)}
.big{padding:16px 40px;border-radius:99px;border:0;font-size:20px;font-weight:800;background:#fff;color:#4834d4;width:100%;max-width:300px}
.big.pro{background:#ffd23f;color:#3a2a00}
.sec{background:rgba(255,255,255,.16);border-radius:16px;padding:12px;margin:10px 0}
.sec h3{margin:0 0 8px;font-size:14px}
.chip{padding:8px 12px;border-radius:99px;border:2px solid transparent;background:rgba(255,255,255,.25);color:#fff;font-size:14px;font-weight:600;margin:3px 2px}
.chip.sel{background:#fff;color:#4834d4}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;margin:3px;font-size:14px}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px #4834d4}
.bn{font-size:13px;margin-top:6px;opacity:.95}
#pv{text-align:center;margin:6px 0}
.nm{display:flex;gap:8px}.nm input{flex:1;padding:12px;border-radius:12px;border:0;font-size:16px;background:#fff;color:#1a1c3a}
.pv{border:0;background:rgba(255,255,255,.25);border-radius:14px;padding:4px}.pv:active{background:#fff}
/* ===== Pestañas ===== */
#fin{font-size:13px;font-weight:700;margin-top:2px}
#pan{flex:1;min-height:0;overflow-y:auto}
.tp{display:none;padding-bottom:8px}.tp.on{display:block}
.ph{padding:10px 16px 0;font-size:14px;font-weight:800;color:var(--mu)}
.tp .e{margin:8px 16px 0}
.tp .acts{max-height:none;overflow:visible}
.tp>button,#invs>button,#invs2>button{display:block;width:calc(100% - 32px);margin:8px 16px 0;padding:13px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-size:15px;font-weight:700}
.acts:empty::before{content:'Sin acciones disponibles ahora.';color:var(--mu);font-size:13px;padding:6px 0}
#rel:empty::before{content:'Todavía no tienes pareja ni hijos.';grid-column:1/-1;color:var(--mu);font-size:13px}
body[data-tab="ini"] #pan{display:none}
body:not([data-tab="ini"]) #log{flex:none;height:96px}
#log{min-height:0}
#nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
#nav button{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 3px 6px;border:0;background:none;color:var(--mu);font-size:10px;font-weight:700;white-space:nowrap}
#nav button span{font-size:19px;line-height:1}
#nav button.on{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
/* ===================== REDISEÑO VISUAL · capa de estilos ===================== */
:root{--bg:#E8F0EC;--card:#FFFFFF;--tx:#14302A;--mu:#5B776F;--ac:#0E7C66;--acd:#08584A;--sun:#FFC63D;--sund:#D99A00;--bd:#D3E2DB;--soft:#F2F7F4;--ok:#1F9D63;--warn:#E09A00;--bad:#D64545;--badd:#A92F2F;
 --fd:"Fredoka","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--fb:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1C18;--card:#15302A;--tx:#E3F1EC;--mu:#8FB1A7;--bd:#244239;--soft:#1B3832;--ac:#23A587;--acd:#11705B}}
:root[data-theme="dark"]{--bg:#0D1C18;--card:#15302A;--tx:#E3F1EC;--mu:#8FB1A7;--bd:#244239;--soft:#1B3832;--ac:#23A587;--acd:#11705B}
body{font-family:var(--fb);font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@media (min-width:700px){html{background:color-mix(in srgb,var(--bg) 70%,#000 8%)}body{box-shadow:0 0 0 1px var(--bd),0 20px 60px rgba(8,40,33,.18)}}
button{font-family:var(--fd);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button:disabled{cursor:not-allowed}

/* --- Cabecera del personaje --- */
.top{background:var(--ac);background-image:radial-gradient(120% 140% at 100% 0%,rgba(255,198,61,.28),transparent 55%),radial-gradient(90% 120% at 0% 100%,rgba(0,0,0,.18),transparent 60%);
 color:#fff;padding:16px 16px 44px;border-radius:0 0 28px 28px;gap:14px;align-items:center;position:relative}
.avslot{flex:none;width:76px;height:76px;border-radius:24px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;overflow:hidden}
.who{min-width:0;flex:1}
.top h1{font-family:var(--fd);font-weight:600;font-size:24px;line-height:1.1;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-size:14px;opacity:.92;margin-top:3px;line-height:1.3}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#fin,#yr{display:inline-flex;align-items:center;gap:4px;margin:0;padding:4px 10px;border-radius:99px;font-family:var(--fd);font-weight:600;font-size:14px;line-height:1.2}
#fin{background:var(--sun);color:#3B2A00;box-shadow:0 2px 0 var(--sund)}
#yr{background:rgba(255,255,255,.18);color:#fff}

/* --- Estadísticas principales (HUD) --- */
#stats{margin:-32px 12px 0;padding:0;position:relative;z-index:1;gap:8px}
.st{font-size:13px;color:var(--mu);font-weight:700}
#stats .st,#rel .st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:9px 11px 10px;display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:6px}
#stats .st .bar,#rel .st .bar{grid-column:1/-1}
.stv{font-family:var(--fd);font-size:20px;font-weight:600;color:var(--tx);line-height:1}
.bar{height:8px;background:var(--soft);margin-top:6px;box-shadow:inset 0 0 0 1px var(--bd)}
#rel{padding:8px 16px 4px}
#rel:empty{padding:4px 16px}

/* --- Acontecimientos --- */
.logh{display:none}
body[data-tab="ini"] .logh{display:block}
#log{gap:0;padding:4px 16px 10px}
#log .e{position:relative;background:transparent;border:0;border-left:2px solid var(--bd);border-radius:0;margin:0 0 0 7px;padding:6px 4px 10px 16px;font-size:15px}
#log .e::before{content:"";position:absolute;left:-7px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--card);box-shadow:0 0 0 2px var(--mu)}
#log .e.g::before{box-shadow:0 0 0 2px var(--ok);background:var(--ok)}
#log .e.b::before{box-shadow:0 0 0 2px var(--bad);background:var(--bad)}
#log .e:last-child{border-left-color:transparent}
#log .e b{color:var(--ac);font-family:var(--fd);font-weight:600;margin-right:2px}
body:not([data-tab="ini"]) #log{height:92px;border-bottom:1px solid var(--bd);margin-top:8px}

/* --- Títulos de sección --- */
.ph{font-family:var(--fd);font-weight:600;font-size:18px;color:var(--tx);padding:16px 16px 2px;letter-spacing:.1px}
.tp>.ph:first-child{padding-top:14px}

/* --- Tarjetas --- */
.e{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;font-size:15px;line-height:1.45}
.tp .e{margin:10px 16px 0}
.e b{color:var(--tx)}
#amis .e{padding:14px;margin:0 0 10px!important}
#amis .e>b:first-child{font-family:var(--fd);font-size:18px;font-weight:600;color:var(--tx)}

/* --- Botones: sistema común --- */
/* principal */
#ov button,.tp>button,#invs>button,#invs2>button{font-family:var(--fd);font-weight:600;font-size:16px;letter-spacing:.1px;border-radius:14px;padding:13px 14px;border:0;background:var(--ac);color:#fff;box-shadow:0 3px 0 var(--acd);transition:transform .06s,box-shadow .06s}
#ov button:active:not(:disabled),.tp>button:active:not(:disabled),#invs>button:active:not(:disabled),#invs2>button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--acd)}
.tp>button,#invs>button,#invs2>button{margin:10px 16px 0}
/* secundario */
#ov button.s{background:var(--soft);color:var(--tx);box-shadow:0 3px 0 var(--bd),inset 0 0 0 1px var(--bd)}
/* peligro */
#ov button.dg,#ov [data-hs],#ov [data-sell],#ov #fpdc,#amis [data-dc]{background:var(--card)!important;color:var(--bad)!important;box-shadow:0 3px 0 var(--bd),inset 0 0 0 1.5px var(--bad)!important;border:0!important}
/* desactivado */
#ov button:disabled,.tp>button:disabled,#invs>button:disabled,#invs2>button:disabled,.acts button:disabled,#amis button:disabled{opacity:.5!important;background:transparent!important;color:var(--mu)!important;box-shadow:inset 0 0 0 1.5px var(--bd)!important;border:0!important;filter:grayscale(1);transform:none!important}
/* botones de las tarjetas de amigo (secundarios) */
#amis button:not(:disabled){font-family:var(--fd)!important;font-weight:600!important;font-size:14px!important;border:0!important;background:var(--soft)!important;color:var(--tx)!important;box-shadow:0 2px 0 var(--bd),inset 0 0 0 1px var(--bd)!important;border-radius:12px!important;padding:10px 6px!important}
#amis button[data-pv]{background:var(--ac)!important;color:#fff!important;box-shadow:0 3px 0 var(--acd)!important}
#amis button[data-dc]:not(:disabled){background:var(--card)!important;color:var(--bad)!important;box-shadow:0 2px 0 var(--bd),inset 0 0 0 1.5px var(--bad)!important}

/* --- Acciones en cuadrícula (fichas de juego) --- */
.acts{gap:8px;padding:10px 16px 2px}
.acts button,.eacts button{font-family:var(--fd);font-weight:600;font-size:14px;line-height:1.2;padding:14px 6px;border-radius:16px;border:0;background:var(--card);color:var(--tx);box-shadow:0 3px 0 var(--bd),inset 0 0 0 1px var(--bd);min-height:52px}
.acts button:active:not(:disabled),.eacts button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bd),inset 0 0 0 1px var(--bd)}
.eacts{gap:8px;padding:10px 16px 2px}

/* --- Botón de avanzar año: el gran botón del juego --- */
.age{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:.3px;margin:8px 14px 10px;padding:15px;border-radius:20px;border:0;background:var(--sun);color:#3B2A00;box-shadow:0 5px 0 var(--sund),0 10px 22px rgba(217,154,0,.28);transition:transform .06s,box-shadow .06s}
.age:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sund),0 4px 10px rgba(217,154,0,.25)}

/* --- Navegación inferior --- */
#nav{gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:var(--card)}
#nav button{flex:1 1 0;min-width:0;border-radius:14px;padding:6px 1px 5px;gap:3px;font-family:var(--fd);font-weight:500;font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
#nav button span{font-size:21px;transition:transform .15s}
#nav button.on{color:var(--acd);background:color-mix(in srgb,var(--ac) 14%,transparent);box-shadow:none;font-weight:600}
#nav button.on span{transform:translateY(-1px) scale(1.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #nav button.on{color:#fff}}
:root[data-theme="dark"] #nav button.on{color:#fff}
@media (max-width:360px){#nav button{font-size:10px}#nav button span{font-size:19px}}

/* --- Ventanas y eventos --- */
#ov{background:rgba(6,30,25,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#ov .bx{border-radius:26px;padding:22px 18px 16px;position:relative;box-shadow:0 -2px 0 var(--sun) inset,0 24px 60px rgba(0,0,0,.3);animation:sheet .22s ease-out}
#ov .bx::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:9px;background:var(--bd)}
#ov .bx>p:first-child{font-family:var(--fb);font-size:17px;line-height:1.45;margin:6px 0 14px;font-weight:600}
#ov .bx>p:first-child b{font-family:var(--fd);font-weight:600;font-size:21px;color:var(--tx)}
#ov button{margin:8px 0}
#ov input{font-family:var(--fb)}
@keyframes sheet{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#ov .bx{animation:none}*{transition:none!important}}
@media (min-width:700px){#ov{align-items:center}#ov .bx::before{display:none}}

/* --- Pantallas de título y creación --- */
.scr{background:#0B4F41;background-image:radial-gradient(110% 70% at 85% 0%,rgba(255,198,61,.35),transparent 60%),radial-gradient(90% 60% at 0% 100%,rgba(35,165,135,.55),transparent 65%)}
#ti h1{font-family:var(--fd);font-weight:700;font-size:58px;letter-spacing:1px;text-shadow:0 5px 0 rgba(0,0,0,.18)}
.scr h2{font-family:var(--fd);font-weight:600}
.big{font-family:var(--fd);font-weight:600;color:var(--acd);box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .06s,box-shadow .06s}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.big.pro{background:var(--sun);color:#3B2A00;box-shadow:0 5px 0 var(--sund)}
.sec{border-radius:20px;background:rgba(255,255,255,.12)}
.sec h3{font-family:var(--fd);font-weight:600;font-size:16px}
.chip{font-family:var(--fd);font-weight:500}
.chip.sel{color:var(--acd)}

/* ajustes de la fase visual */
#nav button{flex:1 1 auto;padding:6px 3px 5px;font-size:10.5px;letter-spacing:-.1px}
@media (max-width:360px){#nav{padding-left:3px;padding-right:3px;gap:0}#nav button{font-size:10px;padding:6px 2px 5px}}
.evi{font-size:46px;line-height:1;text-align:center;margin:8px 0 6px}
#ov .bx>p.evt{text-align:center;font-size:18px;font-weight:700;margin:4px 6px 16px;line-height:1.4}
#ov .bx>p.evt b{font-size:20px}
body:not([data-tab="ini"]) .top{padding:10px 14px 34px}
body:not([data-tab="ini"]) .avslot{width:54px;height:54px;border-radius:18px}
body:not([data-tab="ini"]) .avslot svg{transform:scale(.8)}
body:not([data-tab="ini"]) #yr{display:none}
body:not([data-tab="ini"]) .top h1{font-size:20px}
body:not([data-tab="ini"]) #stats{margin-top:-26px;gap:6px}
body:not([data-tab="ini"]) #stats .st{padding:6px 10px 7px;font-size:12px}
body:not([data-tab="ini"]) .stv{font-size:16px}
body:not([data-tab="ini"]) #log{height:84px;background:var(--card);border:1px solid var(--bd);border-radius:16px;margin:8px 12px 0;padding:8px 12px 4px}
body:not([data-tab="ini"]) #log .e{font-size:14px;padding-bottom:6px}
#stats .st>span,#rel .st>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){#stats .st,#rel .st{font-size:12px;padding:8px 9px 9px}.stv{font-size:18px}}
/* ===================== REDISEÑO · FASE 2 (composición) ===================== */
:root{--hero1:#0E7C66;--hero2:#16A486;--sky1:#BFEFE2;--sky2:#F3FBF8;--ground:#9AD8C2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1F5A4C;--sky2:#173F36;--ground:#2C6E5D}}
:root[data-theme="dark"]{--sky1:#1F5A4C;--sky2:#173F36;--ground:#2C6E5D}

/* layout principal */
#main{display:flex;flex-direction:column;min-height:0}
#main>*{flex-shrink:0}
body[data-tab="ini"] #main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}
body:not([data-tab="ini"]) #main{flex:none}

/* ---------- HÉROE (Inicio) ---------- */
#main .top{display:block;margin:12px 12px 0;padding:0;border-radius:28px;background:var(--card);color:var(--tx);box-shadow:0 0 0 1px var(--bd),0 6px 0 var(--bd);overflow:hidden;background-image:none}
.stage{position:relative;height:200px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,var(--sky1),var(--sky2));overflow:hidden}
.sky{position:absolute;inset:0;background:radial-gradient(circle at 82% 26%,var(--sun) 0 26px,rgba(255,198,61,.25) 27px 46px,transparent 47px),radial-gradient(60% 22% at 50% 104%,var(--ground) 0 98%,transparent 100%)}
.stage #av{position:relative;z-index:1;margin-bottom:12px;filter:drop-shadow(0 8px 0 rgba(8,60,48,.18))}
.stage #av svg{width:150px!important;height:auto!important;border-radius:28px!important;display:block}
.stg{position:absolute;left:12px;top:12px;z-index:2;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.75);color:var(--acd);font-family:var(--fd);font-weight:600;font-size:14px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.idc{padding:14px 16px 16px}
.idrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.who{min-width:0}
#main .top h1{font-family:var(--fd);font-weight:600;font-size:30px;line-height:1.05;color:var(--tx);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main .top small#sub{display:block;color:var(--mu);font-size:14px;margin-top:4px;opacity:1}
.agebig{flex:none;text-align:center;background:var(--ac);color:#fff;border-radius:20px;padding:6px 12px 7px;box-shadow:0 4px 0 var(--acd);min-width:72px}
.agebig b{display:block;font-family:var(--fd);font-weight:700;font-size:34px;line-height:1}
.agebig span{font-family:var(--fd);font-size:13px;font-weight:500;opacity:.9}
#main .chips{margin-top:12px}
#yr{background:var(--soft);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd)}

/* ---------- ESTADÍSTICAS ---------- */
#stats{margin:12px 12px 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;position:static}
#stats .st{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:8px;align-items:center;padding:12px;border-radius:20px;box-shadow:0 3px 0 var(--bd);background:var(--card);border:1px solid var(--bd)}
#stats .si,#rel .si{grid-row:1/3;font-size:26px;width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--soft)}
#stats .sl,#rel .sl{font-size:13px;color:var(--mu);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#stats .stv,#rel .stv{font-size:24px;text-align:left;line-height:1.05}
#stats .bar,#rel .bar{grid-column:1/-1;margin-top:9px}
#stats .money .stv{font-size:19px;white-space:nowrap}
#stats .money .ssv{grid-column:1/-1;margin-top:8px;font-size:12.5px;color:var(--mu);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stats .money{background:linear-gradient(160deg,#FFF7DD,var(--card));border-color:#F3DC97}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #stats .money{background:var(--card);border-color:var(--bd)}}
:root[data-theme="dark"] #stats .money{background:var(--card);border-color:var(--bd)}
#stats .wide{grid-column:1/-1;grid-template-columns:auto auto 1fr auto;grid-template-rows:auto;padding:9px 12px}
#stats .wide .si{grid-row:auto;width:32px;height:32px;font-size:18px;border-radius:10px}
#stats .wide .stv{font-size:18px;grid-column:4}
#stats .wide .bar{grid-column:3;grid-row:1;margin:0 4px}

/* ---------- TIMELINE ---------- */
.tl{margin:16px 12px 6px;background:var(--card);border-radius:24px;border:1px solid var(--bd);padding:4px 0 8px}
.logh{display:block;padding:14px 16px 6px!important;font-size:20px!important}
#log{display:flex;flex-direction:column-reverse;padding:0 12px;overflow:visible;flex:none;gap:0}
.yg{display:flex;flex-direction:column}
.yh{position:relative;margin:10px 0 4px;padding-left:46px}
.yh span{display:inline-block;font-family:var(--fd);font-weight:600;font-size:13px;color:var(--acd);background:color-mix(in srgb,var(--ac) 14%,transparent);padding:3px 10px;border-radius:99px}
.its{display:flex;flex-direction:column-reverse}
#log .e{display:flex;gap:12px;align-items:flex-start;background:none;border:0;border-radius:0;margin:0;padding:0 0 12px;position:relative;font-size:15px;line-height:1.4}
#log .e::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;height:auto;border-radius:2px;background:var(--bd);box-shadow:none}
#log .e.g::before,#log .e.b::before{background:var(--bd);box-shadow:none}
#log .e .ic{flex:none;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--bd);position:relative;z-index:1}
#log .e.g .ic{background:color-mix(in srgb,var(--ok) 16%,var(--card));box-shadow:inset 0 0 0 1.5px var(--ok)}
#log .e.b .ic{background:color-mix(in srgb,var(--bad) 13%,var(--card));box-shadow:inset 0 0 0 1.5px var(--bad)}
#log .e .tx{padding-top:7px;min-width:0;overflow-wrap:anywhere}
#log .e b{color:var(--tx)}

/* ---------- MODO COMPACTO (resto de pestañas) ---------- */
body:not([data-tab="ini"]) #main .top{display:flex;align-items:center;gap:12px;margin:10px 12px 0;padding:8px 10px 8px 8px;border-radius:22px;box-shadow:0 0 0 1px var(--bd),0 3px 0 var(--bd)}
body:not([data-tab="ini"]) .stage{flex:none;width:60px;height:60px;border-radius:18px;align-items:center}
body:not([data-tab="ini"]) .stage .sky{background:radial-gradient(60% 30% at 50% 110%,var(--ground) 0 98%,transparent 100%)}
body:not([data-tab="ini"]) .stage #av{margin:0;filter:none}
body:not([data-tab="ini"]) .stage #av svg{width:52px!important;border-radius:14px!important}
body:not([data-tab="ini"]) .stg,body:not([data-tab="ini"]) #yr{display:none}
body:not([data-tab="ini"]) .idc{flex:1;min-width:0;padding:0;display:flex;align-items:center;gap:8px;justify-content:space-between}
body:not([data-tab="ini"]) .idrow{min-width:0;flex:1}
body:not([data-tab="ini"]) .agebig{display:none}
body:not([data-tab="ini"]) #main .top h1{font-size:20px}
body:not([data-tab="ini"]) #main .top small#sub{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body:not([data-tab="ini"]) #main .chips{margin:0;flex:none}
body:not([data-tab="ini"]) #stats{grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
body:not([data-tab="ini"]) #stats .st{display:flex;flex-direction:column;align-items:center;padding:6px 2px 7px;border-radius:14px;box-shadow:0 2px 0 var(--bd);gap:2px;background:var(--card)}
body:not([data-tab="ini"]) #stats .si{width:auto;height:auto;background:none;font-size:17px}
body:not([data-tab="ini"]) #stats .sl,body:not([data-tab="ini"]) #stats .ssv,body:not([data-tab="ini"]) #stats .bar{display:none}
body:not([data-tab="ini"]) #stats .stv{font-size:15px;text-align:center}
body:not([data-tab="ini"]) #stats .money .stv{font-size:11.5px}
body:not([data-tab="ini"]) #stats .wide{grid-column:auto}
body:not([data-tab="ini"]) .tl{margin:8px 12px 0;padding:0;border-radius:16px;height:auto;max-height:54px;overflow:hidden}
body:not([data-tab="ini"]) .logh,body:not([data-tab="ini"]) .yh,body:not([data-tab="ini"]) .yg:not(:last-child){display:none!important}
body:not([data-tab="ini"]) #log{height:auto!important;max-height:none;background:none;border:0;margin:0;padding:8px 10px}
body:not([data-tab="ini"]) #log .its .e:not(:last-child){display:none}
body:not([data-tab="ini"]) #log .e{padding:0;font-size:13.5px;align-items:center}
body:not([data-tab="ini"]) #log .e::before{display:none}
body:not([data-tab="ini"]) #log .e .ic{width:28px;height:28px;font-size:15px;border-radius:9px}
body:not([data-tab="ini"]) #log .e .tx{padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- BOTÓN ENVEJECER ---------- */
.age{display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 14px 11px}
.agl{font-size:20px;line-height:1.15}
#agnx{font-family:var(--fb);font-weight:800;font-size:12.5px;opacity:.75}
body[data-tab="ini"] .age{margin-top:6px;padding:15px 14px 13px;border-radius:24px}
body[data-tab="ini"] .agl{font-size:22px}

/* ---------- SECCIONES ---------- */
.tp{padding:2px 0 14px}
.ph{font-size:20px;padding:18px 16px 4px}
.ph.sub2{font-size:16px;color:var(--mu);padding-top:12px}
.tp .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px 2px}
.acts button,.eacts button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 6px 12px;min-height:92px;border-radius:20px;font-size:14px;max-width:none}
.ai{font-size:30px;line-height:1}
.al{line-height:1.15}
.eacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.eacts button{font-size:14px}
.acts:empty{display:block}
@media (max-width:360px){.tp .acts,.eacts{grid-template-columns:repeat(2,1fr)}}

/* familia */
#rel{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px 0}
#rel .st.person{display:grid;grid-template-columns:auto 1fr auto;column-gap:8px;align-items:center;padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--bd);box-shadow:0 3px 0 var(--bd)}
#rel .si{grid-row:1;width:40px;height:40px;font-size:22px;border-radius:50%}
#rel .stv{font-size:18px}
#rel .bar{grid-column:1/-1}
#rel:empty::before{display:block;padding:4px 0}

/* tarjeta de amigo */
#amis{padding:10px 16px 0!important}
#amis .fcard{padding:14px!important;border-radius:24px;box-shadow:0 4px 0 var(--bd);margin:0 0 14px!important}
.fhead{display:flex;gap:12px;align-items:center}
.fav{flex:none;width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(180deg,var(--sky1),var(--sky2));box-shadow:inset 0 -10px 0 var(--ground)}
.fid{display:flex;flex-direction:column;gap:1px;min-width:0;color:var(--mu);font-size:14px}
.fn{font-family:var(--fd);font-weight:600;font-size:22px;color:var(--tx)!important;line-height:1.1}
.flv{margin-top:12px;padding:10px 12px;border-radius:16px;background:var(--soft)}
.flvt{display:flex;justify-content:space-between;gap:8px;font-size:14px;align-items:baseline}
.flvt b{font-family:var(--fd);font-weight:600;font-size:16px;color:var(--tx)}
.flvt span{color:var(--mu);font-weight:700;white-space:nowrap}
.flv .bar,.plv .bar{background:var(--card)}
.finfo{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.finfo span{font-size:13px;padding:4px 9px;border-radius:99px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--bd);color:var(--tx)}
.fcount{color:var(--mu);font-size:13px;font-weight:700;text-align:center;margin:-2px 0 4px}
#amis .fcard button,#ov .pf button.fa{font-family:var(--fd)!important;border:0!important;border-radius:14px!important;line-height:1.2!important;margin:0!important;display:flex!important;flex-direction:column;align-items:center;justify-content:center;width:100%}
#amis .fcard button.fpv{margin-top:12px!important;padding:11px!important;font-size:15px!important;background:var(--ac)!important;color:#fff!important;box-shadow:0 3px 0 var(--acd)!important}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#amis .fcard button.fa:not(:disabled),#ov .pf button.fa:not(:disabled){padding:11px 6px!important;font-size:14px!important;font-weight:600!important;background:var(--soft)!important;color:var(--tx)!important;box-shadow:0 3px 0 var(--bd),inset 0 0 0 1px var(--bd)!important}
#amis .fcard button.fa.neg:not(:disabled),#ov .pf button.fa.neg:not(:disabled){background:var(--card)!important;color:var(--bad)!important;box-shadow:0 3px 0 var(--bd),inset 0 0 0 1.5px var(--bad)!important}
#amis .fcard button.fa:disabled,#ov .pf button.fa:disabled{padding:9px 6px!important;font-size:13px!important;font-weight:600!important;opacity:.55!important}
button.fa small{display:block;font-family:var(--fb);font-weight:700;font-size:11px;margin-top:3px;line-height:1.25}

/* perfil del amigo */
#ov .pf{text-align:left}
.pstage{height:150px;margin:-6px -18px 0;border-radius:26px 26px 0 0;background:linear-gradient(180deg,var(--sky1),var(--sky2));position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pstage::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:70px;border-radius:50%;background:var(--ground)}
.pav{position:relative;z-index:1;font-size:96px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 6px 0 rgba(8,60,48,.15))}
#ov .bx:has(.pf){padding-top:6px}
#ov .bx:has(.pf)::before{z-index:2;background:rgba(255,255,255,.7)}
.pname{font-family:var(--fd);font-weight:600;font-size:28px;text-align:center;margin-top:10px}
.pmeta{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.pmeta span{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--bd)}
.plv{padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--ac) 10%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 30%,transparent)}
.plv .flvt b{font-size:19px}
.pblk{margin-top:10px;padding:12px 14px;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 1px var(--bd)}
.pbt{font-family:var(--fd);font-weight:600;font-size:16px;margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pgrid .pblk{margin-top:10px}
.pkv{display:flex;flex-direction:column;gap:1px;font-size:13px;color:var(--mu);margin-top:4px}
.pkv b{font-size:15px;color:var(--tx)}
.pblk .fgrid{margin-top:0}
.phist{max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.phi{display:flex;flex-direction:column;font-size:14px;line-height:1.35;padding-left:10px;border-left:3px solid var(--bd)}
.phi b{font-family:var(--fd);font-weight:600;font-size:12.5px;color:var(--acd)}
.pempty{color:var(--mu);font-size:14px}
@media (max-width:360px){.pgrid{grid-template-columns:1fr}}

/* trabajo */
#job{margin:10px 16px 0}
.jhero{display:flex;gap:14px;align-items:center;padding:16px;border-radius:24px;background:var(--ac);color:#fff;box-shadow:0 5px 0 var(--acd);background-image:radial-gradient(90% 120% at 100% 0%,rgba(255,198,61,.3),transparent 60%)}
.jhero.off{background:var(--card);color:var(--tx);box-shadow:0 0 0 1px var(--bd),0 4px 0 var(--bd);background-image:none}
.jic{flex:none;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:32px}
.jhero.off .jic{background:var(--soft)}
.jhero small{display:block;font-size:13px;font-weight:700;opacity:.85}
.jt{display:block;font-family:var(--fd);font-weight:600;font-size:24px;line-height:1.15;color:inherit!important}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mt{padding:12px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);box-shadow:0 3px 0 var(--bd);display:flex;flex-direction:column;gap:3px;min-width:0}
.mt span{font-size:13px;color:var(--mu);font-weight:700}
.mt b{font-family:var(--fd);font-weight:600;font-size:18px;color:var(--tx);overflow-wrap:anywhere}

/* dinero */
#fin2{margin:10px 16px 0}
.mhero{padding:18px 18px 16px;border-radius:26px;background:var(--sun);color:#3B2A00;box-shadow:0 5px 0 var(--sund);background-image:radial-gradient(80% 120% at 100% 0%,rgba(255,255,255,.45),transparent 60%)}
.mlb{display:block;font-family:var(--fd);font-weight:600;font-size:15px}
.mbig{display:block;font-family:var(--fd);font-weight:700;font-size:40px;line-height:1.1;margin:4px 0 6px;color:#2A1E00!important;overflow-wrap:anywhere}
.mhero small{font-size:12.5px;font-weight:700;opacity:.75}
.mown{margin-top:10px;padding:12px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.mown div{display:flex;flex-direction:column;gap:2px}
.mown span{font-size:13px;color:var(--mu);font-weight:700}
.mown b{font-size:15px;color:var(--tx)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 16px 0}
.row2 button{font-family:var(--fd);font-weight:600;font-size:14px;line-height:1.2;padding:12px 8px;border-radius:16px;border:0;background:var(--soft);color:var(--tx);box-shadow:0 3px 0 var(--bd),inset 0 0 0 1px var(--bd)}
.row2 button:disabled{opacity:.5;box-shadow:inset 0 0 0 1.5px var(--bd);background:transparent;color:var(--mu)}
#invs .e,#invs2 .e{border-radius:22px;padding:14px 16px;box-shadow:0 3px 0 var(--bd);line-height:1.55}
#invs .e>b:first-child,#invs2 .e>b:first-child{font-family:var(--fd);font-weight:600;font-size:18px}
#invs>button,#invs2>button{width:calc(100% - 32px)}
#ads{background:transparent!important;color:var(--mu)!important;box-shadow:inset 0 0 0 1.5px var(--bd)!important;font-size:14px!important}

/* logros */
.lgsum{margin:10px 16px 0;padding:16px;border-radius:24px;background:var(--ac);color:#fff;box-shadow:0 5px 0 var(--acd)}
.lgsum>div{display:flex;align-items:baseline;gap:8px}
.lgsum b{font-family:var(--fd);font-weight:700;font-size:38px;line-height:1}
.lgsum b small{font-size:20px;opacity:.75}
.lgsum span{font-weight:700;opacity:.9}
.lgsum .bar{background:rgba(255,255,255,.25);box-shadow:none;margin-top:12px;height:10px}
.lggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 16px 0}
.lgc{display:flex;flex-direction:column;gap:2px;padding:14px 12px;border-radius:20px;background:var(--card);border:1px solid var(--bd);box-shadow:0 3px 0 var(--bd);min-width:0}
.lgi{font-size:34px;line-height:1;margin-bottom:4px}
.lgc b{font-family:var(--fd);font-weight:600;font-size:15px}
.lgc small{font-size:12.5px;color:var(--mu);line-height:1.3}
.lgc em{font-style:normal;font-size:12px;font-weight:800;margin-top:6px;color:var(--mu)}
.lgc.on{border-color:#F3DC97;background:linear-gradient(170deg,#FFF6D6,var(--card) 70%)}
.lgc.on em{color:var(--ok)}
.lgc:not(.on) .lgi{filter:grayscale(1);opacity:.45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgc.on{background:var(--card);border-color:var(--sund)}}
:root[data-theme="dark"] .lgc.on{background:var(--card);border-color:var(--sund)}

/* ajustes */
.setl{margin:10px 16px 0;border-radius:22px;background:var(--card);border:1px solid var(--bd);overflow:hidden}
.setr{display:flex;width:100%;align-items:center;justify-content:space-between;padding:16px;border:0;background:none;color:var(--tx);font-family:var(--fd);font-weight:600;font-size:17px;border-bottom:1px solid var(--bd)}
.setr:last-child{border-bottom:0}
.tog{min-width:56px;padding:5px 10px;border-radius:99px;font-size:14px;background:var(--soft);color:var(--mu);box-shadow:inset 0 0 0 1px var(--bd);text-align:center}
.tog.on{background:var(--ac);color:#fff;box-shadow:0 2px 0 var(--acd)}

/* tarjetas de tienda / estudios dentro de ventanas */
#ov .bx div[style*="border-radius:16px;overflow:hidden"],#ov .bx div[style*="border-radius:14px;padding:10px 12px"]{border-radius:22px!important;box-shadow:0 3px 0 var(--bd)}

@media (min-width:700px){#main .top .stage{height:230px}.stage #av svg{width:170px!important}.tp .acts,.eacts{grid-template-columns:repeat(4,1fr)}.lggrid{grid-template-columns:repeat(3,1fr)}}

 body[data-tab="ini"] #main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:4px;align-content:start}
 body[data-tab="ini"] #main .top{grid-column:1;grid-row:1}
 body[data-tab="ini"] #stats{grid-column:1;grid-row:2;align-self:start}
 body[data-tab="ini"] .tl{grid-column:2;grid-row:1/3;margin-top:12px;align-self:start}
 .age{max-width:520px;width:calc(100% - 28px);margin-left:auto!important;margin-right:auto!important}
 #nav{justify-content:center}#nav button{flex:0 1 120px}
 .tp{max-width:760px;margin:0 auto}
 body:not([data-tab="ini"]) #main{width:100%;max-width:760px;margin:0 auto}}
body:not([data-tab="ini"]) #main .top .stage{height:60px}
body:not([data-tab="ini"]) #fin{display:none}
@media (max-width:360px){
 .stage{height:170px}.stage #av svg{width:126px!important}
 #stats .st{padding:10px;column-gap:6px}#stats .si{width:34px;height:34px;font-size:21px;border-radius:11px}
 #stats .sl{font-size:12px}#stats .stv{font-size:21px}#stats .money .stv{font-size:16px}
 #rel{grid-template-columns:1fr}
 #main .top h1{font-size:26px}.agebig{min-width:62px;padding:5px 10px 6px}.agebig b{font-size:28px}
 .mbig{font-size:34px}}
.evi{width:88px;height:88px;margin:8px auto 10px;border-radius:30px;background:linear-gradient(180deg,var(--sky1),var(--sky2));box-shadow:inset 0 -14px 0 var(--ground),0 4px 0 var(--bd);display:flex;align-items:center;justify-content:center;font-size:48px}
#ov .bx>p.evt{font-family:var(--fd);font-weight:600;font-size:20px}

/* ===================== FASE 3 · Inicio y Personalización ===================== */
/* --- Escena del personaje --- */
